<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RiftCity Safe Minigame Lab - 7 Modes</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#080a0f;color:#f4f6f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:12px}
.wrap{max-width:1050px;margin:auto}
.card{background:#11161e;border:1px solid #2a323e;border-radius:16px;padding:14px}
h1,h2,h3,p{margin-top:0}
.eyebrow{font-size:11px;letter-spacing:.14em;color:#8d97a5;font-weight:800}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.top p{color:#a7b0bd;margin-bottom:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
select,button,input{font:inherit}
select,button{background:#171d26;color:#fff;border:1px solid #37404c;border-radius:10px;min-height:42px;padding:8px 12px}
button{font-weight:800}
button.primary{background:#e9ebee;color:#0a0d11}
.stage{background:#0b0f15;border:1px solid #2a323d;border-radius:14px;padding:14px;min-height:520px}
.mode-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.small{font-size:12px;color:#9da7b4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px}
.result{min-height:32px;margin-top:12px;font-weight:800;text-align:center}
.good{color:#b6f2c7}.bad{color:#ffb6b6}
.hidden{display:none!important}
.meter{height:12px;border-radius:999px;background:#090c11;border:1px solid #2b333e;overflow:hidden}
.meter>div{height:100%;background:#c8cdd4;width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}

/* dial */
.dialWrap{position:relative;width:min(78vw,340px);aspect-ratio:1}
.dial{position:absolute;inset:8%;border-radius:50%;border:12px solid #27303b;background:radial-gradient(circle at 35% 30%,#303a47,#11161d 70%);touch-action:none;color:#fff}
.dial .center{position:absolute;inset:30%;border-radius:50%;background:#0b0f14;border:2px solid #3a4553;display:flex;align-items:center;justify-content:center;flex-direction:column}
.dialNum{font-size:52px;font-weight:900}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:22px solid #e5e7eb}

/* tumblers */
.tumblers{display:flex;gap:10px;align-items:flex-end;justify-content:center;min-height:300px}
.pin{width:54px;background:#0c1016;border:1px solid #303947;border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.pinBar{width:28px;background:#aeb6c2;border-radius:6px 6px 2px 2px}
.zone{height:18px;border:1px dashed #7f8a99;border-radius:5px;margin-top:7px;width:100%}

/* waveform */
.wave{display:flex;align-items:center;gap:4px;height:180px;padding:10px;background:#0b0f14;border-radius:12px;border:1px solid #29313d}
.wave i{display:block;flex:1;background:#9ba5b2;border-radius:999px;min-width:3px}
.scanner{width:100%;max-width:600px}

/* rings */
.rings{position:relative;width:min(74vw,330px);aspect-ratio:1}
.ring{position:absolute;border:16px solid #596574;border-radius:50%;inset:0}
.ring.r2{inset:16%;border-color:#788493}
.ring.r3{inset:32%;border-color:#9da6b2}
.notch{position:absolute;top:-18px;left:50%;width:16px;height:28px;background:#0b0f14;transform:translateX(-50%)}

/* route */
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:auto}
.node{min-height:64px;border-radius:12px;border:1px solid #34404d;background:#151b24}
.node.on{background:#dfe3e8;color:#090c10}
.node.badnode{border-color:#754646}

/* listen */
.stopTrack{height:26px;border-radius:999px;background:#0b0f14;border:1px solid #2b3440;position:relative;overflow:hidden;max-width:650px;width:100%}
.stopTarget{position:absolute;top:0;bottom:0;background:#4c5561}
.stopNeedle{position:absolute;top:-4px;bottom:-4px;width:4px;background:#f4f5f6}

/* deduction */
.guessgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.guessgrid input{min-height:46px;border-radius:10px;border:1px solid #37414e;background:#0b0f14;color:#fff;padding:8px;text-align:center;font-size:20px}
.history{display:grid;gap:6px;max-width:520px;margin-top:12px}
.history div{background:#0b0f14;border:1px solid #29313c;border-radius:9px;padding:8px}

/* sound/listen */
.pulseBox{font-size:54px;font-weight:900;letter-spacing:.08em}

@media(max-width:700px){
 .top{flex-direction:column}
 .grid2{grid-template-columns:1fr}
 .stage{min-height:auto}
 .big-center{min-height:390px}
 .mode-title{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="top">
      <div>
        <div class="eyebrow">RIFTCITY SAFE MINIGAME LAB</div>
        <h1>7 Playable Safe Prototypes</h1>
        <p>Switch between every concept here before we choose what goes into the real crime system.</p>
      </div>
      <div class="small"><b>COMPLETE 7-MODE BUILD</b></div>
    </div>

    <div class="controls">
      <select id="modeSelect">
        <option value="dial">1. Manual Combination Dial</option>
        <option value="tumblers">2. Tumbler Alignment</option>
        <option value="wave">3. Sound-Wave Scanner</option>
        <option value="rings">4. Rotating Ring Alignment</option>
        <option value="route">5. Electronic Node Route</option>
        <option value="listen">6. Listen & Stop</option>
        <option value="deduce">7. Combination Deduction</option>
      </select>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>
      <button id="resetBtn" type="button">Reset Current</button>
      <button id="debugBtn" type="button">Toggle Debug</button>
    </div>

    <section id="gameStage" class="stage"></section>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let debug=false;
let cleanup=()=>{};
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap100=n=>((n%100)+100)%100;
const diff=()=>$("difficulty").value;

function setStage(html){ cleanup(); cleanup=()=>{}; $("gameStage").innerHTML=html; }
function msg(text,good=true){ const el=$("result"); if(el){el.textContent=text;el.className="result "+(good?"good":"bad");} }

function renderDial(){
 setStage(`
 <div class="mode-title"><div><h2>Manual Combination Dial</h2><div class="small">Find three hidden numbers in Left → Right → Left order.</div></div><div class="small">Classic mechanical safe</div></div>
 <div class="big-center">
  <div class="dialWrap"><button id="dial" class="dial" type="button"><div class="pointer"></div><div class="center"><div id="dialNum" class="dialNum">00</div><div id="dialDir" class="small">TURN LEFT</div></div></button></div>
  <div style="width:min(100%,560px);margin-top:12px"><div class="meter"><div id="dialSignal"></div></div></div>
  <div class="row" style="margin-top:12px"><button id="dLeft">◀ Left</button><button id="dSet" class="primary">Set Number</button><button id="dRight">Right ▶</button></div>
  <div id="debugText" class="small"></div><div id="result" class="result"></div>
 </div>`);
 const widths={easy:8,normal:5,hard:3}; const w=widths[diff()];
 let combo=[rand(0,99),rand(0,99),rand(0,99)], stage=0, cur=rand(0,99), last=null, drag=false, lastA=0;
 const dirs=["left","right","left"];
 const dist=(a,b)=>Math.min(Math.abs(a-b),100-Math.abs(a-b));
 function update(){
   $("dialNum").textContent=String(cur).padStart(2,"0");
   $("dialDir").textContent=stage>=3?"OPEN":"TURN "+dirs[stage].toUpperCase();
   const d=stage>=3?0:dist(cur,combo[stage]); $("dialSignal").style.width=(stage>=3?100:clamp((1-d/24)*100,0,100))+"%";
   $("debugText").textContent=debug?`DEBUG: ${combo.join(" / ")} | Stage ${stage+1}`:"";
 }
 function move(dir,amt=1){ if(stage>=3)return; last=dir; cur=wrap100(cur+(dir==="right"?amt:-amt)); update(); }
 $("dLeft").onclick=()=>move("left"); $("dRight").onclick=()=>move("right");
 $("dSet").onclick=()=>{ if(last!==dirs[stage]) return msg("Wrong direction.",false); if(dist(cur,combo[stage])<=w){stage++; msg(stage===3?"Safe opened!":"Click found.",true); update()}else msg("No click.",false); };
 const dial=$("dial");
 const ang=e=>{const r=dial.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
 dial.onpointerdown=e=>{drag=true;lastA=ang(e);dial.setPointerCapture(e.pointerId)};
 dial.onpointermove=e=>{if(!drag)return;let a=ang(e),d=a-lastA;if(d>180)d-=360;if(d<-180)d+=360;if(Math.abs(d)>3){move(d>0?"right":"left",Math.max(1,Math.round(Math.abs(d)/5)));lastA=a}};
 dial.onpointerup=()=>drag=false; dial.onpointercancel=()=>drag=false;
 update();
}

function renderTumblers(){
 const count=diff()==="easy"?4:diff()==="normal"?5:6;
 setStage(`<div class="mode-title"><div><h2>Tumbler Alignment</h2><div class="small">Raise/lower every pin until its top lands inside the target band.</div></div></div>
 <div class="big-center"><div id="tumblers" class="tumblers"></div><div class="row" style="margin-top:14px"><button id="check" class="primary">Try Lock</button></div><div id="debugText" class="small"></div><div id="result" class="result"></div></div>`);
 let vals=Array.from({length:count},()=>rand(15,85));
 let targets=Array.from({length:count},()=>rand(38,68));
 const tol=diff()==="easy"?9:diff()==="normal"?6:4;
 function draw(){
   $("tumblers").innerHTML=vals.map((v,i)=>`<div class="pin"><button data-i="${i}" data-d="1">▲</button><div class="pinBar" style="height:${90+v*2}px"></div><div class="zone"></div><button data-i="${i}" data-d="-1">▼</button></div>`).join("");
   $("tumblers").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,d=+b.dataset.d;vals[i]=clamp(vals[i]+d*(diff()==="hard"?3:5),0,100);draw()});
   $("debugText").textContent=debug?`DEBUG targets: ${targets.join(", ")} | Current: ${vals.join(", ")}`:"";
 }
 $("check").onclick=()=>{const ok=vals.every((v,i)=>Math.abs(v-targets[i])<=tol);msg(ok?"Tumblers aligned — safe opened!":"Pins aren't aligned yet.",ok)};
 draw();
}

function renderWave(){
 setStage(`<div class="mode-title"><div><h2>Sound-Wave Scanner</h2><div class="small">Scan positions and find the three strongest mechanical signatures.</div></div></div>
 <div class="big-center scanner">
   <div id="wave" class="wave"></div>
   <div class="row" style="width:100%;margin-top:14px"><button id="scanLeft">◀ Scan</button><div style="flex:1"><div class="meter"><div id="waveMeter"></div></div></div><button id="scanRight">Scan ▶</button></div>
   <div class="row" style="margin-top:12px"><button id="waveLock" class="primary">Lock Signature</button></div>
   <div id="wavePos" class="small"></div><div id="debugText" class="small"></div><div id="result" class="result"></div>
 </div>`);
 let secrets=[rand(8,28),rand(36,63),rand(70,92)], found=[], pos=0;
 const tol=diff()==="easy"?5:diff()==="normal"?3:2;
 function nearest(){return Math.min(...secrets.filter(s=>!found.includes(s)).map(s=>Math.abs(s-pos)))}
 function draw(){
   const d=found.length===3?0:nearest(); const strength=found.length===3?100:clamp((1-d/18)*100,0,100);
   $("waveMeter").style.width=strength+"%"; $("wavePos").textContent=`Scanner position: ${pos}`;
   $("wave").innerHTML=Array.from({length:34},(_,i)=>`<i style="height:${15+Math.abs(Math.sin((i+pos)/4))*120*(strength/100)+rand(0,16)}px"></i>`).join("");
   $("debugText").textContent=debug?`DEBUG signatures: ${secrets.join(", ")} | Found ${found.length}/3`:"";
 }
 const move=n=>{pos=clamp(pos+n,0,99);draw()};
 $("scanLeft").onclick=()=>move(-2);$("scanRight").onclick=()=>move(2);
 $("waveLock").onclick=()=>{const target=secrets.filter(s=>!found.includes(s)).sort((a,b)=>Math.abs(a-pos)-Math.abs(b-pos))[0];if(Math.abs(target-pos)<=tol){found.push(target);msg(found.length===3?"All signatures found — opened!":"Signature locked.",true)}else msg("Wrong mechanical signature.",false);draw()};
 draw();
}

function renderRings(){
 setStage(`<div class="mode-title"><div><h2>Rotating Ring Alignment</h2><div class="small">Align all three hidden notches at the top.</div></div></div>
 <div class="big-center"><div class="rings"><div id="r1" class="ring"><div class="notch"></div></div><div id="r2" class="ring r2"><div class="notch"></div></div><div id="r3" class="ring r3"><div class="notch"></div></div></div>
 <div class="row"><button data-r="0">Outer +</button><button data-r="1">Middle +</button><button data-r="2">Inner +</button><button id="ringCheck" class="primary">Try Lock</button></div><div id="debugText" class="small"></div><div id="result" class="result"></div></div>`);
 let ang=[rand(0,11)*30,rand(0,11)*30,rand(0,11)*30], targets=[0,0,0];
 const coupled=diff()==="hard";
 function draw(){["r1","r2","r3"].forEach((id,i)=>$(id).style.transform=`rotate(${ang[i]}deg)`);$("debugText").textContent=debug?`DEBUG angles: ${ang.join(", ")}`:"";}
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;ang[i]=(ang[i]+30)%360;if(coupled&&i<2)ang[i+1]=(ang[i+1]+30)%360;draw()});
 $("ringCheck").onclick=()=>{const ok=ang.every(a=>a%360===0);msg(ok?"All rings aligned — opened!":"Notches are not aligned.",ok)};
 draw();
}

function renderRoute(){
 setStage(`<div class="mode-title"><div><h2>Electronic Node Route</h2><div class="small">Create a powered path from START to LOCK without activating alarm nodes.</div></div></div>
 <div class="big-center"><div id="nodes" class="nodes"></div><div class="row" style="margin-top:14px"><button id="routeCheck" class="primary">Test Circuit</button></div><div id="debugText" class="small"></div><div id="result" class="result"></div></div>`);
 const n=12, start=0, end=11;
 let selected=new Set([start,end]);
 const alarm=new Set(diff()==="easy"?[6]:diff()==="normal"?[5,8]:[3,6,9]);
 const validPath=[0,1,2,6,10,11].filter(i=>!alarm.has(i));
 function draw(){
   $("nodes").innerHTML=Array.from({length:n},(_,i)=>`<button class="node ${selected.has(i)?"on":""} ${alarm.has(i)?"badnode":""}" data-n="${i}" ${i===start||i===end?"disabled":""}>${i===start?"START":i===end?"LOCK":"NODE "+i}</button>`).join("");
   $("nodes").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const i=+b.dataset.n;if(selected.has(i))selected.delete(i);else selected.add(i);draw()});
   $("debugText").textContent=debug?`DEBUG valid route nodes: ${validPath.join(" → ")}`:"";
 }
 $("routeCheck").onclick=()=>{const alarms=[...selected].some(i=>alarm.has(i));const path=validPath.every(i=>selected.has(i));msg(!alarms&&path?"Circuit accepted — electronic safe opened!":alarms?"Alarm node activated.":"Route incomplete.",!alarms&&path)};
 draw();
}

function renderListen(){
 setStage(`<div class="mode-title"><div><h2>Listen & Stop</h2><div class="small">Stop the moving needle when the lock emits its strongest click.</div></div></div>
 <div class="big-center" style="width:100%"><div class="pulseBox" id="pulseText">...</div><div class="stopTrack"><div id="stopTarget" class="stopTarget"></div><div id="needle" class="stopNeedle"></div></div><button id="stopBtn" class="primary" style="margin-top:18px">STOP</button><div id="debugText" class="small"></div><div id="result" class="result"></div></div>`);
 let x=0,dir=1, target=rand(18,78), width=diff()==="easy"?14:diff()==="normal"?9:6, raf;
 $("stopTarget").style.left=target+"%";$("stopTarget").style.width=width+"%"; if(!debug)$("stopTarget").style.opacity=".08";
 function loop(){x+=dir*(diff()==="hard"?0.65:0.42);if(x>=100||x<=0)dir*=-1;x=clamp(x,0,100);$("needle").style.left=x+"%";const center=target+width/2,d=Math.abs(x-center);$("pulseText").textContent=d<5?"CLICK CLICK":d<14?"click...":"...";raf=requestAnimationFrame(loop)}
 $("stopBtn").onclick=()=>{const ok=x>=target&&x<=target+width;msg(ok?"Perfect click — lock opened!":"Missed the click window.",ok)};
 $("debugText").textContent=debug?`DEBUG target: ${target.toFixed(0)}–${(target+width).toFixed(0)}%`:"";
 loop(); cleanup=()=>cancelAnimationFrame(raf);
}

function renderDeduce(){
 setStage(`<div class="mode-title"><div><h2>Combination Deduction</h2><div class="small">Use limited guesses and feedback to determine the hidden 3-digit code.</div></div></div>
 <div class="big-center"><div class="guessgrid"><input id="g1" inputmode="numeric" maxlength="1"><input id="g2" inputmode="numeric" maxlength="1"><input id="g3" inputmode="numeric" maxlength="1"></div><button id="guessBtn" class="primary" style="margin-top:12px">Submit Guess</button><div id="attempts" class="small"></div><div id="history" class="history"></div><div id="debugText" class="small"></div><div id="result" class="result"></div></div>`);
 const code=[rand(0,9),rand(0,9),rand(0,9)], max=diff()==="easy"?8:diff()==="normal"?6:5;let tries=0;
 function upd(){ $("attempts").textContent=`Attempts: ${tries} / ${max}`;$("debugText").textContent=debug?`DEBUG code: ${code.join("")}`:""; }
 $("guessBtn").onclick=()=>{if(tries>=max)return;const vals=[$("g1").value,$("g2").value,$("g3").value].map(v=>Number(v));if(vals.some(v=>Number.isNaN(v)||v<0||v>9))return msg("Enter all three digits.",false);tries++;let exact=0,present=0;const remCode=[],remGuess=[];for(let i=0;i<3;i++){if(vals[i]===code[i])exact++;else{remCode.push(code[i]);remGuess.push(vals[i])}}for(const g of remGuess){const ix=remCode.indexOf(g);if(ix>=0){present++;remCode.splice(ix,1)}}const line=document.createElement("div");line.textContent=`${vals.join("")} — ${exact} exact, ${present} correct digit wrong place`;$("history").prepend(line);if(exact===3)msg("Code solved — safe opened!",true);else if(tries>=max)msg("Out of guesses.",false);else msg("Use the feedback and try again.",true);upd()};
 upd();
}

const renderers={dial:renderDial,tumblers:renderTumblers,wave:renderWave,rings:renderRings,route:renderRoute,listen:renderListen,deduce:renderDeduce};
function render(){renderers[$("modeSelect").value]();}
$("modeSelect").onchange=render;
$("difficulty").onchange=render;
$("resetBtn").onclick=render;
$("debugBtn").onclick=()=>{debug=!debug;render()};
render();
})();
</script>
</body>
</html>
