<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RiftCity Circuit Safe</title>

<style>
*{box-sizing:border-box}

:root{
  color-scheme:dark;
  --good:#9df0b6;
  --bad:#ff9696;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at top,#102019,#050806 55%,#020302);
  color:#f5f7f6;
}

body{
  padding:7px;
}

button,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,660px);
  margin:auto;
}

.shell{
  background:#07100c;
  border:1px solid #33493e;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 22px 65px #000a;
}

/* ---------------- TOP ---------------- */

.top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;

  padding:9px 10px;

  border-bottom:1px solid #2b4337;
  background:#0b1510;
}

.brand{
  min-width:0;
}

.kicker{
  font-size:8px;
  letter-spacing:.15em;
  font-weight:900;
  color:#82958a;
}

.title{
  font-size:15px;
  font-weight:950;
  line-height:1.05;
  margin-top:2px;
}

.sub{
  font-size:9px;
  color:#8fa196;
  margin-top:3px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(3,auto);
  gap:4px;
  align-items:center;
}

.chip{
  min-width:58px;
  text-align:center;

  padding:5px 6px;

  border:1px solid #3a5145;
  background:#07110d;

  border-radius:8px;

  font-size:9px;
}

.timer{
  font-size:11px;
  font-weight:950;
}

.timer.warning{
  color:#ffd16b;
}

.timer.danger{
  color:#ff8181;
  animation:timerPulse .45s ease-in-out infinite;
}

@keyframes timerPulse{
  50%{opacity:.4}
}

/* ---------------- TOOLBAR ---------------- */

.toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:6px;

  padding:7px 8px;

  border-bottom:1px solid #2b4337;
  background:#09110d;
}

select,
.toolbar button,
.clear{
  min-height:38px;

  border:1px solid #3a5346;
  background:#0f1b15;
  color:#fff;

  border-radius:8px;

  padding:6px 9px;

  font-weight:800;
}

.toolbar button{
  min-width:92px;
}

/* ---------------- GAME ---------------- */

.game{
  padding:7px;
}

.safe{
  position:relative;

  border:1px solid #3a5949;
  border-radius:12px;

  background:#06100b;

  padding:6px;

  overflow:hidden;
}

.safe.shorting{
  animation:shortBoard .15s linear 7;
}

@keyframes shortBoard{
  50%{
    border-color:#ff3838;

    filter:
      brightness(1.38)
      saturate(1.35);

    box-shadow:
      inset 0 0 48px #ff000048,
      0 0 24px #ff000036;
  }
}

/* ---------------- BOARD ---------------- */

.board{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:9px;

  isolation:isolate;

  background:#06100b;
}

/* All three unique safe templates use the same 1086 × 1448 canvas. */
.board.easy,
.board.normal,
.board.hard{
  aspect-ratio:1086 / 1448;
}

.boardBg{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:fill;

  z-index:0;

  pointer-events:none;
  user-select:none;

  display:block;
}

.boardShade{
  position:absolute;
  inset:0;

  z-index:1;

  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      transparent 58%,
      rgba(0,0,0,.08) 100%
    );
}

/* ---------------- BOARD INFO HUD ---------------- */

.boardInfo{
  position:absolute;
  z-index:7;
  left:13%;
  right:13%;
  top:5.1%;
  height:13.2%;
  display:grid;
  grid-template-columns:1.4fr .85fr .85fr;
  gap:2.4%;
  align-items:center;
  pointer-events:none;
  color:#e9efec;
  text-shadow:0 1px 2px #000;
}

.boardInfoBlock{
  min-width:0;
}

.boardInfoLabel{
  font-size:clamp(7px,1.45vw,12px);
  font-weight:900;
  letter-spacing:.12em;
  color:#9da8a3;
}

.boardInfoValue{
  margin-top:2px;
  font-size:clamp(12px,3.4vw,25px);
  line-height:1;
  font-weight:950;
  letter-spacing:.03em;
}

.boardInfoValue.small{
  font-size:clamp(10px,2.5vw,19px);
}

.boardInfoHint{
  margin-top:4px;
  font-size:clamp(6px,1.25vw,10px);
  color:#8f9994;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ---------------- STATUS LIGHTS ---------------- */

.statusRail{
  position:absolute;

  z-index:5;

  left:50%;
  top:22.2%;

  transform:translateX(-50%);

  display:flex;
  gap:4px;

  padding:3px 5px;

  border-radius:999px;

  background:rgba(5,10,7,.58);

  border:1px solid rgba(170,180,172,.25);

  backdrop-filter:blur(1px);
}

.led{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#242a27;

  border:1px solid #59605c;

  transition:.16s;
}

.led.on{
  background:var(--c);
  border-color:var(--c);

  box-shadow:
    0 0 7px var(--c),
    0 0 13px var(--c);

  animation:ledPulse .9s ease-in-out infinite;
}

@keyframes ledPulse{
  50%{
    filter:brightness(1.55);
    transform:scale(1.12);
  }
}

/* ---------------- TERMINALS ---------------- */

.terminal{
  position:absolute;

  z-index:6;

  width:clamp(38px,10.2%,64px);

  aspect-ratio:1;

  transform:translate(-50%,-50%);

  border:0;
  background:transparent;

  padding:0;

  color:#fff;

  touch-action:manipulation;

  display:grid;
  place-items:center;

  overflow:visible;
}

.terminal .hit{
  position:absolute;
  inset:1px;

  border-radius:12px;

  background:rgba(0,0,0,.01);
}

.ring{
  position:relative;

  width:44%;
  aspect-ratio:1;

  border-radius:50%;

  border:3px solid var(--c);

  background:rgba(5,8,7,.76);

  box-shadow:
    inset 0 0 0 3px rgba(0,0,0,.75),
    0 0 5px color-mix(
      in srgb,
      var(--c) 70%,
      transparent
    );

  transition:.12s;
}

.terminal.selected .ring{
  transform:scale(1.17);

  box-shadow:
    inset 0 0 0 3px rgba(0,0,0,.7),
    0 0 10px var(--c),
    0 0 18px color-mix(
      in srgb,
      var(--c) 65%,
      transparent
    );

  animation:ringPulse .7s ease-in-out infinite;
}

@keyframes ringPulse{
  50%{
    filter:brightness(1.4);
  }
}

.terminal.complete{
  opacity:.62;
}

.terminal.complete .ring{
  box-shadow:
    inset 0 0 0 3px rgba(0,0,0,.7),
    0 0 8px var(--c);
}

.code{
  position:absolute;

  top:78%;
  left:50%;

  transform:translateX(-50%);

  font-size:7px;
  font-weight:950;

  letter-spacing:.03em;
  line-height:1;

  padding:2px 4px;

  border-radius:5px;

  background:rgba(3,7,5,.72);

  border:1px solid rgba(160,170,164,.28);

  white-space:nowrap;

  color:#e5e9e6;
}

/* ---------------- WIRES ---------------- */

.wires{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:4;
}

.wire{
  fill:none;

  stroke-width:4.8;

  stroke-linecap:round;
}

.wire.new{
  stroke-dasharray:650;
  stroke-dashoffset:650;

  animation:
    draw .42s ease forwards,
    charge .62s ease .42s;
}

@keyframes draw{
  to{
    stroke-dashoffset:0;
  }
}

@keyframes charge{
  50%{
    stroke-width:7;
    filter:brightness(1.75);
  }
}

.power{
  fill:none;

  stroke:#fff;

  stroke-width:1.8;

  stroke-dasharray:5 15;

  opacity:0;

  animation:travel .9s linear .35s 2;
}

@keyframes travel{

  0%{
    stroke-dashoffset:70;
    opacity:0;
  }

  15%,85%{
    opacity:.9;
  }

  100%{
    stroke-dashoffset:-70;
    opacity:0;
  }
}

/* ---------------- SHORT ---------------- */

.shortOverlay,
.unlock{
  position:absolute;
  inset:0;

  z-index:20;

  display:flex;

  align-items:center;
  justify-content:center;

  opacity:0;

  pointer-events:none;
}

.shortOverlay{
  background:#a8000022;
}

.shortOverlay.show{
  opacity:1;

  animation:redblink .14s linear infinite;
}

@keyframes redblink{
  50%{
    background:#ff00005b;
  }
}

.shortMsg{
  padding:9px 13px;

  border:1px solid #ff6868;

  background:#300707e8;

  border-radius:9px;

  color:#ffb0b0;

  font-size:12px;
  font-weight:950;

  letter-spacing:.06em;
}

/* ---------------- SPARKS ---------------- */

.spark{
  position:absolute;

  width:5px;
  height:5px;

  border-radius:50%;

  background:white;

  z-index:25;

  pointer-events:none;

  box-shadow:
    0 0 7px white,
    0 0 12px #ff4b35;

  animation:spark .43s ease-out forwards;
}

@keyframes spark{
  to{
    transform:
      translate(var(--x),var(--y))
      scale(.1);

    opacity:0;
  }
}

/* ---------------- UNLOCK ---------------- */

.unlock{
  z-index:30;

  background:#031008e8;

  transition:opacity .2s;
}

.unlock.show{
  opacity:1;
}

.unlockBox{
  padding:15px 19px;

  border:1px solid #4c8864;

  background:#081d13;

  border-radius:11px;

  text-align:center;

  transform:scale(.82);
}

.unlock.show .unlockBox{
  animation:unlock .36s ease forwards;
}

@keyframes unlock{
  to{
    transform:scale(1);
  }
}

.unlockTitle{
  font-size:19px;
  font-weight:950;

  color:#a1f4b8;
}

.unlockSub{
  font-size:9px;
  color:#90a69a;
  margin-top:3px;
}

/* ---------------- BOTTOM ---------------- */

.bottom{
  display:grid;

  grid-template-columns:auto minmax(0,1fr);

  gap:6px;

  align-items:center;

  margin-top:6px;
}

.clear{
  font-size:9px;
  font-weight:900;

  min-height:34px;
}

.result{
  min-height:28px;

  display:flex;
  align-items:center;

  padding:4px 7px;

  border:1px solid #263c31;

  background:#07100c;

  border-radius:8px;

  font-size:9px;
  font-weight:850;

  color:#99aaa0;
}

.result.good{
  color:var(--good);
}

.result.bad{
  color:var(--bad);
}

/* ---------------- MOBILE ---------------- */

@media(max-width:430px){

  body{
    padding:3px;
  }

  .shell{
    border-radius:12px;
  }

  .top{
    padding:7px;
  }

  .title{
    font-size:13px;
  }

  .sub{
    display:none;
  }

  .chip{
    min-width:51px;
    padding:4px;
    font-size:8px;
  }

  .timer{
    font-size:10px;
  }

  .toolbar{
    padding:5px;
  }

  .toolbar button{
    min-width:78px;
  }

  .game{
    padding:4px;
  }

  .safe{
    padding:4px;
  }

  .terminal{
    width:clamp(44px,12%,56px);
  }

  .ring{
    width:41%;
  }

  .code{
    font-size:6px;
    top:76%;
  }

  .statusRail{
    top:5%;
    gap:3px;
  }

  .led{
    width:7px;
    height:7px;
  }

  .bottom{
    margin-top:4px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }

}

</style>
</head>

<body>

<main class="app">

<section class="shell">

<header class="top">

<div class="brand">

<div class="kicker">
RIFTCITY SAFE BYPASS
</div>

<div class="title">
Circuit Wire Match
</div>

<div class="sub">
Match every circuit before the bypass window closes.
</div>

</div>

<div class="hud">

<div id="timer" class="chip timer">
24.0s
</div>

<div id="matched" class="chip">
0 / 4
</div>

<div id="mistakes" class="chip">
0 / 3
</div>

</div>

</header>

<div class="toolbar">

<select id="difficulty">

<option value="easy">
Easy — 3 wires
</option>

<option value="normal" selected>
Normal — 4 wires
</option>

<option value="hard">
Hard — 6 wires
</option>

</select>

<button
id="newSafe"
type="button">
New Safe
</button>

</div>

<div class="game">

<section
id="safe"
class="safe">

<div
id="board"
class="board normal">

<!-- REAL IMAGE LAYER -->
<img
id="boardBg"
class="boardBg"
src="./assets/circuit-board-4.png?v=6"
alt=""
draggable="false">

<div class="boardShade"></div>

<div class="boardInfo" aria-hidden="true">
  <div class="boardInfoBlock">
    <div class="boardInfoLabel">SAFE BYPASS</div>
    <div id="boardMode" class="boardInfoValue small">4-WIRE CIRCUIT</div>
    <div class="boardInfoHint">Match each left socket to its paired right socket.</div>
  </div>
  <div class="boardInfoBlock">
    <div class="boardInfoLabel">TIME</div>
    <div id="boardTimer" class="boardInfoValue">24.0</div>
  </div>
  <div class="boardInfoBlock">
    <div class="boardInfoLabel">MATCHED / MISS</div>
    <div id="boardProgress" class="boardInfoValue small">0 / 4 · 0</div>
  </div>
</div>

<div
id="statusRail"
class="statusRail">
</div>

<svg
id="svg"
class="wires"
preserveAspectRatio="none">
</svg>

</div>

<div class="bottom">

<button
id="clear"
class="clear"
type="button">
Clear
</button>

<div
id="result"
class="result"
aria-live="polite">
Select a wire.
</div>

</div>

<div
id="shortOverlay"
class="shortOverlay">

<div class="shortMsg">
CIRCUIT SHORT
</div>

</div>

<div
id="unlock"
class="unlock">

<div class="unlockBox">

<div class="unlockTitle">
SAFE UNLOCKED
</div>

<div class="unlockSub">
Electronic bypass complete
</div>

</div>

</div>

</section>

</div>

</section>

</main>

<script>
(() => {

const $ =
  id =>
    document.getElementById(id);

const WIRES = [

{
  id:"red",
  name:"Red",
  color:"#ee5555",
  code:"A1"
},

{
  id:"blue",
  name:"Blue",
  color:"#52a1ff",
  code:"B7"
},

{
  id:"green",
  name:"Green",
  color:"#5bd982",
  code:"C4"
},

{
  id:"yellow",
  name:"Yellow",
  color:"#e4c34f",
  code:"D2"
},

{
  id:"purple",
  name:"Purple",
  color:"#ad77e8",
  code:"E8"
},

{
  id:"orange",
  name:"Orange",
  color:"#e98b47",
  code:"F3"
}

];

const SETTINGS = {

easy:{
  count:3,
  time:30,
  mistakes:99,
  short:800
},

normal:{
  count:4,
  time:24,
  mistakes:3,
  short:1000
},

hard:{
  count:6,
  time:18,
  mistakes:2,
  short:1250
}

};

/*
Exact positions for the selected board artwork.
*/

const POS = {

  /* Coordinates are percentages of the 1086 × 1448 template canvas. */
  easy:{
    leftX:18.0,
    rightX:82.0,
    ys:[
      36.8,
      52.5,
      68.8
    ]
  },

  normal:{
    leftX:18.0,
    rightX:83.0,
    ys:[
      28.4,
      43.3,
      58.4,
      73.6
    ]
  },

  hard:{
    leftX:18.4,
    rightX:81.7,
    ys:[
      32.9,
      41.7,
      50.8,
      59.9,
      69.0,
      78.0
    ]
  }

};

const BOARD_IMAGES = {

easy:
  "./assets/circuit-board-3.png?v=6",

normal:
  "./assets/circuit-board-4.png?v=6",

hard:
  "./assets/circuit-board-6.png?v=6"

};

let wires = [];

let rightOrder = [];

let selected = null;

let connected =
  new Set();

let mistakeCount = 0;

let locked = false;

let shorted = false;

let timerHandle = null;

let deadline = 0;

const cfg =
  () =>
    SETTINGS[
      $("difficulty").value
    ];

const mode =
  () =>
    $("difficulty").value;

function shuffle(array){

  const out =
    [...array];

  for(
    let i =
      out.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      out[i],
      out[j]
    ] = [
      out[j],
      out[i]
    ];

  }

  return out;

}

function setBoardImage(){

  const m =
    mode();

  const image =
    $("boardBg");

  /*
  Setting src every reset also helps Safari/GitHub
  refresh the actual asset.
  */

  image.src =
    BOARD_IMAGES[m];

  image.onerror =
    () => {

      setMessage(
        "Board image missing: assets/circuit-board-" +
        cfg().count +
        ".png",
        false
      );

    };

}

function start(){

  clearInterval(
    timerHandle
  );

  selected = null;

  connected =
    new Set();

  mistakeCount = 0;

  locked = false;

  shorted = false;

  $("shortOverlay")
    .classList
    .remove("show");

  $("unlock")
    .classList
    .remove("show");

  $("safe")
    .classList
    .remove("shorting");

  const m =
    mode();

  $("board")
    .className =
      "board " + m;

  setBoardImage();

  wires =
    WIRES.slice(
      0,
      cfg().count
    );

  rightOrder =
    shuffle(wires);

  renderTerminals();

  renderLEDs();

  setMessage(
    "Select a wire."
  );

  deadline =
    performance.now() +
    cfg().time * 1000;

  timerHandle =
    setInterval(
      updateTimer,
      50
    );

  updateTimer();

  updateUI();

  requestAnimationFrame(
    () =>
      drawWires()
  );

}

function renderLEDs(){

  $("statusRail")
    .innerHTML =
      wires.map(
        wire => `

          <span
            class="led"
            data-led="${wire.id}"
            style="--c:${wire.color}">
          </span>

        `
      )
      .join("");

}

function terminal(
  wire,
  side,
  row
){

  const button =
    document
      .createElement(
        "button"
      );

  button.type =
    "button";

  button.className =
    "terminal";

  button.dataset.id =
    wire.id;

  button.dataset.side =
    side;

  button.style
    .setProperty(
      "--c",
      wire.color
    );

  const positions =
    POS[mode()];

  button.style.left =
    (
      side === "left"
      ? positions.leftX
      : positions.rightX
    ) + "%";

  button.style.top =
    positions.ys[row] +
    "%";

  button.innerHTML = `

    <span class="hit"></span>

    <span class="ring"></span>

    <span class="code">
      ${wire.code}
    </span>

  `;

  button.setAttribute(
    "aria-label",
    `${wire.name} ${
      side === "left"
      ? "wire"
      : "port"
    } ${wire.code}`
  );

  button.addEventListener(
    "click",
    () => {

      if(
        side === "left"
      ){

        chooseWire(
          wire.id
        );

      }else{

        choosePort(
          wire.id,
          button
        );

      }

    }
  );

  return button;

}

function renderTerminals(){

  const board =
    $("board");

  board
    .querySelectorAll(
      ".terminal"
    )
    .forEach(
      element =>
        element.remove()
    );

  wires.forEach(
    (wire,index) => {

      board.appendChild(
        terminal(
          wire,
          "left",
          index
        )
      );

    }
  );

  rightOrder.forEach(
    (wire,index) => {

      board.appendChild(
        terminal(
          wire,
          "right",
          index
        )
      );

    }
  );

}

function chooseWire(id){

  if(
    locked ||
    shorted ||
    connected.has(id)
  ){
    return;
  }

  selected = id;

  const wire =
    WIRES.find(
      wire =>
        wire.id === id
    );

  setMessage(
    `${wire.name} wire selected.`
  );

  updateUI();

}

function choosePort(
  id,
  element
){

  if(
    locked ||
    shorted ||
    !selected ||
    connected.has(id)
  ){
    return;
  }

  if(
    selected === id
  ){

    const newConnection =
      selected;

    connected.add(
      newConnection
    );

    selected = null;

    const led =
      document.querySelector(
        `[data-led="${newConnection}"]`
      );

    if(led){
      led.classList.add("on");
    }

    updateUI();

    requestAnimationFrame(
      () =>
        drawWires(
          newConnection
        )
    );

    setMessage(
      "Circuit connected.",
      true
    );

    if(
      connected.size ===
      wires.length
    ){

      complete();

    }

    return;

  }

  mistakeCount++;

  selected = null;

  updateUI();

  spark(
    element
  );

  shortCircuit();

  if(
    mistakeCount >=
    cfg().mistakes &&
    cfg().mistakes < 50
  ){

    locked = true;

    setTimeout(
      () =>
        fail(
          "ALARM TRIGGERED"
        ),
      cfg().short
    );

  }

}

function shortCircuit(){

  shorted = true;

  $("safe")
    .classList
    .remove(
      "shorting"
    );

  void $("safe")
    .offsetWidth;

  $("safe")
    .classList
    .add(
      "shorting"
    );

  $("shortOverlay")
    .classList
    .add(
      "show"
    );

  setMessage(
    "Circuit short — controls locked.",
    false
  );

  updateUI();

  setTimeout(
    () => {

      $("shortOverlay")
        .classList
        .remove(
          "show"
        );

      $("safe")
        .classList
        .remove(
          "shorting"
        );

      if(!locked){

        shorted = false;

        setMessage(
          "System recovered."
        );

        updateUI();

      }

    },
    cfg().short
  );

}

function spark(element){

  const board =
    $("board");

  const boardRect =
    board
      .getBoundingClientRect();

  const rect =
    element
      .getBoundingClientRect();

  const x =
    rect.left +
    rect.width / 2 -
    boardRect.left;

  const y =
    rect.top +
    rect.height / 2 -
    boardRect.top;

  for(
    let i = 0;
    i < 10;
    i++
  ){

    const spark =
      document
        .createElement(
          "span"
        );

    spark.className =
      "spark";

    spark.style.left =
      x + "px";

    spark.style.top =
      y + "px";

    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      18 +
      Math.random() *
      28;

    spark.style
      .setProperty(
        "--x",
        Math.cos(angle) *
        distance +
        "px"
      );

    spark.style
      .setProperty(
        "--y",
        Math.sin(angle) *
        distance +
        "px"
      );

    board.appendChild(
      spark
    );

    setTimeout(
      () =>
        spark.remove(),
      470
    );

  }

}

function updateTimer(){

  if(locked){
    return;
  }

  const remaining =
    Math.max(
      0,
      deadline -
      performance.now()
    );

  const seconds =
    remaining /
    1000;

  $("timer")
    .textContent =
      seconds
        .toFixed(1) +
      "s";

  $("boardTimer")
    .textContent =
      seconds.toFixed(1);

  $("timer")
    .classList
    .toggle(
      "warning",
      seconds <= 8 &&
      seconds > 4
    );

  $("timer")
    .classList
    .toggle(
      "danger",
      seconds <= 4
    );

  if(
    remaining <= 0
  ){

    fail(
      "BYPASS WINDOW EXPIRED"
    );

  }

}

function complete(){

  locked = true;

  clearInterval(
    timerHandle
  );

  updateUI();

  setMessage(
    "All circuits online...",
    true
  );

  $("board")
    .animate(
      [
        {
          filter:
            "brightness(1)"
        },
        {
          filter:
            "brightness(1.3)"
        },
        {
          filter:
            "brightness(1)"
        }
      ],
      {
        duration:430,
        easing:"ease"
      }
    );

  setTimeout(
    () =>
      $("unlock")
        .classList
        .add(
          "show"
        ),
    430
  );

}

function fail(message){

  if(
    $("unlock")
      .classList
      .contains(
        "show"
      )
  ){
    return;
  }

  locked = true;

  shorted = false;

  clearInterval(
    timerHandle
  );

  $("shortOverlay")
    .classList
    .remove(
      "show"
    );

  setMessage(
    message +
    " — SAFE LOCKED",
    false
  );

  updateUI();

}

function updateUI(){

  document
    .querySelectorAll(
      ".terminal"
    )
    .forEach(
      button => {

        const id =
          button.dataset.id;

        const side =
          button.dataset.side;

        button
          .classList
          .toggle(
            "complete",
            connected.has(id)
          );

        button
          .classList
          .toggle(
            "selected",
            side === "left" &&
            selected === id
          );

        button.disabled =
          locked ||
          shorted ||
          connected.has(id);

      }
    );

  $("matched")
    .textContent =
      `${connected.size} / ${wires.length}`;

  $("boardMode").textContent =
    `${wires.length}-WIRE CIRCUIT`;

  $("boardProgress").textContent =
    `${connected.size} / ${wires.length} · ${mistakeCount}`;

  $("mistakes")
    .textContent =
      cfg().mistakes > 50
      ? `${mistakeCount} miss`
      : `${mistakeCount} / ${cfg().mistakes}`;

  $("clear")
    .disabled =
      locked ||
      shorted ||
      !selected;

}

function drawWires(
  newest = null
){

  const svg =
    $("svg");

  const board =
    $("board");

  const boardRect =
    board
      .getBoundingClientRect();

  svg.innerHTML = "";

  connected.forEach(
    id => {

      const left =
        document.querySelector(
          `[data-side="left"][data-id="${id}"]`
        );

      const right =
        document.querySelector(
          `[data-side="right"][data-id="${id}"]`
        );

      if(
        !left ||
        !right
      ){
        return;
      }

      const leftRect =
        left
          .getBoundingClientRect();

      const rightRect =
        right
          .getBoundingClientRect();

      const x1 =
        leftRect.left +
        leftRect.width / 2 -
        boardRect.left;

      const y1 =
        leftRect.top +
        leftRect.height / 2 -
        boardRect.top;

      const x2 =
        rightRect.left +
        rightRect.width / 2 -
        boardRect.left;

      const y2 =
        rightRect.top +
        rightRect.height / 2 -
        boardRect.top;

      const mid =
        (
          x1 +
          x2
        ) / 2;

      const pathData =
        `M ${x1} ${y1}
         C ${mid} ${y1},
           ${mid} ${y2},
           ${x2} ${y2}`;

      const wire =
        wires.find(
          wire =>
            wire.id === id
        );

      const path =
        document
          .createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
          );

      path.setAttribute(
        "d",
        pathData
      );

      path.setAttribute(
        "stroke",
        wire.color
      );

      path.classList
        .add(
          "wire"
        );

      if(
        id === newest
      ){

        path.classList
          .add(
            "new"
          );

      }

      path.style.filter =
        `drop-shadow(
          0 0 4px
          ${wire.color}
        )`;

      svg.appendChild(
        path
      );

      if(
        id === newest
      ){

        const pulse =
          document
            .createElementNS(
              "http://www.w3.org/2000/svg",
              "path"
            );

        pulse.setAttribute(
          "d",
          pathData
        );

        pulse.classList
          .add(
            "power"
          );

        svg.appendChild(
          pulse
        );

      }

    }
  );

}

function setMessage(
  text,
  good = null
){

  $("result")
    .textContent =
      text;

  $("result")
    .className =
      "result";

  if(
    good === true
  ){

    $("result")
      .classList
      .add(
        "good"
      );

  }

  if(
    good === false
  ){

    $("result")
      .classList
      .add(
        "bad"
      );

  }

}

$("difficulty")
  .addEventListener(
    "change",
    start
  );

$("newSafe")
  .addEventListener(
    "click",
    start
  );

$("clear")
  .addEventListener(
    "click",
    () => {

      if(
        !locked &&
        !shorted
      ){

        selected = null;

        setMessage(
          "Selection cleared."
        );

        updateUI();

      }

    }
  );

window
  .addEventListener(
    "resize",
    () =>
      requestAnimationFrame(
        () =>
          drawWires()
      )
  );

start();

})();
</script>

</body>
</html>
