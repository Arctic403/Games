<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RiftCity Wire Bypass Prototype</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  color-scheme:dark;
  --bg:#07090d;
  --panel:#0f141b;
  --panel2:#151c25;
  --border:#29333f;
  --text:#f4f6f8;
  --muted:#919ca9;
  --good:#9ff0b6;
  --bad:#ff9f9f;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at top,#151c27 0%,#090c11 38%,#05070a 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding:12px;
}

button,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:900px;
  margin:0 auto;
}

.panel{
  background:rgba(15,20,27,.97);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}

.header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}

.kicker{
  font-size:10px;
  letter-spacing:.16em;
  font-weight:900;
  color:var(--muted);
}

h1{
  margin:4px 0 6px;
  font-size:22px;
}

.header p{
  margin:0;
  color:#a6b0bd;
  font-size:13px;
}

.build{
  font-size:10px;
  border:1px solid #35404c;
  border-radius:999px;
  padding:7px 9px;
  white-space:nowrap;
  color:#c2cad3;
}

.toolbar{
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  background:#0a0e13;
}

select,
.toolbar button{
  min-height:42px;
  border-radius:10px;
  border:1px solid #34404d;
  background:#151c25;
  color:white;
  padding:8px 11px;
}

.toolbar button{
  font-weight:800;
}

.game{
  padding:14px;
}

.safe{
  border:1px solid #2a3440;
  border-radius:16px;
  background:
    linear-gradient(145deg,#171e27,#0a0e13);
  padding:16px;
}

.safe-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.safe-top h2{
  margin:0 0 4px;
  font-size:18px;
}

.sub{
  color:var(--muted);
  font-size:12px;
}

.stats{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.chip{
  background:#0b0f14;
  border:1px solid #303b47;
  border-radius:999px;
  padding:7px 9px;
  font-size:11px;
}

.wire-board{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:90px;
  min-height:430px;
  background:#080c11;
  border:1px solid #28323d;
  border-radius:14px;
  padding:18px;
  overflow:hidden;
}

.column{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:10px;
  z-index:2;
}

.column.right{
  align-items:flex-end;
}

.terminal{
  width:100%;
  max-width:245px;
  min-height:58px;
  border:1px solid #36414e;
  background:#121922;
  border-radius:12px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  transition:
    transform .12s ease,
    border-color .12s ease,
    background .12s ease;
  color:white;
}

.right .terminal{
  flex-direction:row-reverse;
}

.terminal:hover{
  background:#18212c;
}

.terminal.selected{
  border-color:white;
  transform:scale(1.025);
  background:#1c2632;
}

.terminal.complete{
  opacity:.5;
}

.socket{
  width:20px;
  height:20px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.65);
  flex:0 0 auto;
  box-shadow:
    inset 0 0 0 3px rgba(0,0,0,.45),
    0 0 12px rgba(255,255,255,.08);
}

.wire-label{
  font-weight:850;
  font-size:13px;
}

.wire-code{
  font-size:10px;
  color:#8995a3;
  margin-top:2px;
}

.svg-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
}

.actions{
  display:flex;
  justify-content:center;
  margin-top:14px;
}

.reset-btn{
  border:1px solid #36414d;
  background:#161e27;
  color:white;
  min-height:44px;
  border-radius:11px;
  padding:9px 14px;
  font-weight:850;
}

.result{
  min-height:36px;
  text-align:center;
  margin-top:10px;
  font-weight:850;
  font-size:13px;
}

.result.good{
  color:var(--good);
}

.result.bad{
  color:var(--bad);
}

.flash{
  animation:flash .25s ease;
}

@keyframes flash{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
  100%{transform:translateX(0)}
}

@media(max-width:680px){
  body{
    padding:7px;
  }

  .header,
  .safe-top{
    flex-direction:column;
  }

  .stats{
    justify-content:flex-start;
  }

  .wire-board{
    gap:28px;
    min-height:400px;
    padding:10px;
  }

  .terminal{
    padding:7px;
    min-height:54px;
  }

  .wire-label{
    font-size:11px;
  }

  .wire-code{
    font-size:9px;
  }

  .socket{
    width:18px;
    height:18px;
  }
}
</style>
</head>

<body>

<main class="app">
  <section class="panel">

    <header class="header">
      <div>
        <div class="kicker">RIFTCITY CRIME PROTOTYPE</div>
        <h1>Electronic Safe Bypass</h1>
        <p>Match each circuit wire to its correct terminal.</p>
      </div>

      <div class="build">WIRE TEST BUILD</div>
    </header>

    <div class="toolbar">

      <select id="difficulty">
        <option value="easy">Easy — 3 wires</option>
        <option value="normal" selected>Normal — 4 wires</option>
        <option value="hard">Hard — 6 wires</option>
      </select>

      <button id="newSafe" type="button">
        New Safe
      </button>

    </div>

    <div class="game">

      <section id="safe" class="safe">

        <div class="safe-top">

          <div>
            <h2>Access Panel</h2>
            <div class="sub">
              Select a wire on the left, then connect it to the matching terminal.
            </div>
          </div>

          <div class="stats">
            <div id="matchedChip" class="chip">
              Matched 0 / 4
            </div>

            <div id="mistakeChip" class="chip">
              Mistakes 0 / 3
            </div>
          </div>

        </div>

        <div id="board" class="wire-board">

          <svg
            id="svg"
            class="svg-layer"
            preserveAspectRatio="none">
          </svg>

          <div id="leftColumn" class="column"></div>

          <div id="rightColumn" class="column right"></div>

        </div>

        <div class="actions">
          <button
            id="clearSelection"
            class="reset-btn"
            type="button">
            Clear Selection
          </button>
        </div>

        <div
          id="result"
          class="result"
          aria-live="polite">
        </div>

      </section>

    </div>

  </section>
</main>

<script>
(() => {

const $ = id => document.getElementById(id);

const COLORS = [
  {
    id: "red",
    name: "Red",
    color: "#e55353",
    code: "A1"
  },
  {
    id: "blue",
    name: "Blue",
    color: "#4e8fe8",
    code: "B7"
  },
  {
    id: "green",
    name: "Green",
    color: "#55b978",
    code: "C4"
  },
  {
    id: "yellow",
    name: "Yellow",
    color: "#d9b94b",
    code: "D2"
  },
  {
    id: "purple",
    name: "Purple",
    color: "#a672df",
    code: "E8"
  },
  {
    id: "orange",
    name: "Orange",
    color: "#d98547",
    code: "F3"
  }
];

let wires = [];

let selectedLeft = null;

let matched = new Set();

let mistakes = 0;

let locked = false;

function shuffle(array) {

  const result = [...array];

  for(let i = result.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

function getWireCount(){

  const difficulty = $("difficulty").value;

  if(difficulty === "easy"){
    return 3;
  }

  if(difficulty === "hard"){
    return 6;
  }

  return 4;

}

function maxMistakes(){

  const difficulty = $("difficulty").value;

  if(difficulty === "easy"){
    return 99;
  }

  if(difficulty === "hard"){
    return 2;
  }

  return 3;

}

function startGame(){

  locked = false;

  selectedLeft = null;

  matched.clear();

  mistakes = 0;

  const count = getWireCount();

  wires = COLORS.slice(0,count);

  render();

  setMessage("");

}

function render(){

  const left = $("leftColumn");

  const right = $("rightColumn");

  left.innerHTML = "";

  right.innerHTML = "";

  const shuffledRight = shuffle(wires);

  wires.forEach(wire => {

    const button = document.createElement("button");

    button.type = "button";

    button.className = "terminal";

    button.dataset.side = "left";

    button.dataset.id = wire.id;

    button.innerHTML = `
      <span
        class="socket"
        style="background:${wire.color}">
      </span>

      <span>
        <div class="wire-label">
          ${wire.name} Wire
        </div>

        <div class="wire-code">
          Circuit ${wire.code}
        </div>
      </span>
    `;

    button.addEventListener(
      "click",
      () => selectLeft(wire.id)
    );

    left.appendChild(button);

  });

  shuffledRight.forEach(wire => {

    const button = document.createElement("button");

    button.type = "button";

    button.className = "terminal";

    button.dataset.side = "right";

    button.dataset.id = wire.id;

    button.innerHTML = `
      <span
        class="socket"
        style="background:${wire.color}">
      </span>

      <span>
        <div class="wire-label">
          ${wire.name} Port
        </div>

        <div class="wire-code">
          Terminal ${wire.code}
        </div>
      </span>
    `;

    button.addEventListener(
      "click",
      () => selectRight(wire.id)
    );

    right.appendChild(button);

  });

  updateUI();

  requestAnimationFrame(drawConnections);

}

function selectLeft(id){

  if(locked || matched.has(id)){
    return;
  }

  selectedLeft = id;

  updateUI();

}

function selectRight(id){

  if(
    locked ||
    !selectedLeft ||
    matched.has(id)
  ){
    return;
  }

  if(selectedLeft === id){

    matched.add(id);

    selectedLeft = null;

    setMessage(
      "Circuit connected.",
      true
    );

    updateUI();

    requestAnimationFrame(
      drawConnections
    );

    if(matched.size === wires.length){

      locked = true;

      setTimeout(() => {

        setMessage(
          "BYPASS COMPLETE — SAFE UNLOCKED",
          true
        );

      },150);

    }

    return;
  }

  mistakes++;

  selectedLeft = null;

  setMessage(
    "Wrong terminal.",
    false
  );

  $("safe").classList.remove("flash");

  void $("safe").offsetWidth;

  $("safe").classList.add("flash");

  const max = maxMistakes();

  if(mistakes >= max){

    locked = true;

    setMessage(
      "ALARM TRIGGERED — BYPASS FAILED",
      false
    );

  }

  updateUI();

}

function updateUI(){

  document
    .querySelectorAll(".terminal")
    .forEach(button => {

      const id = button.dataset.id;

      const side = button.dataset.side;

      button.classList.toggle(
        "complete",
        matched.has(id)
      );

      button.classList.toggle(
        "selected",
        side === "left" &&
        selectedLeft === id
      );

      button.disabled =
        locked ||
        matched.has(id);

    });

  $("matchedChip").textContent =
    `Matched ${matched.size} / ${wires.length}`;

  const max = maxMistakes();

  $("mistakeChip").textContent =
    max > 50
      ? `Mistakes ${mistakes}`
      : `Mistakes ${mistakes} / ${max}`;

}

function setMessage(
  message,
  good = null
){

  const element = $("result");

  element.textContent = message;

  element.className = "result";

  if(good === true){
    element.classList.add("good");
  }

  if(good === false){
    element.classList.add("bad");
  }

}

function drawConnections(){

  const svg = $("svg");

  const board = $("board");

  const boardRect =
    board.getBoundingClientRect();

  svg.innerHTML = "";

  matched.forEach(id => {

    const left =
      document.querySelector(
        `[data-side="left"][data-id="${id}"]`
      );

    const right =
      document.querySelector(
        `[data-side="right"][data-id="${id}"]`
      );

    if(!left || !right){
      return;
    }

    const leftRect =
      left.getBoundingClientRect();

    const rightRect =
      right.getBoundingClientRect();

    const wire =
      wires.find(
        wire => wire.id === id
      );

    const x1 =
      leftRect.right -
      boardRect.left;

    const y1 =
      leftRect.top +
      leftRect.height / 2 -
      boardRect.top;

    const x2 =
      rightRect.left -
      boardRect.left;

    const y2 =
      rightRect.top +
      rightRect.height / 2 -
      boardRect.top;

    const mid =
      (x1 + x2) / 2;

    const path =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    path.setAttribute(
      "d",
      `M ${x1} ${y1}
       C ${mid} ${y1},
         ${mid} ${y2},
         ${x2} ${y2}`
    );

    path.setAttribute(
      "fill",
      "none"
    );

    path.setAttribute(
      "stroke",
      wire.color
    );

    path.setAttribute(
      "stroke-width",
      "5"
    );

    path.setAttribute(
      "stroke-linecap",
      "round"
    );

    path.style.filter =
      `drop-shadow(
        0 0 5px ${wire.color}
      )`;

    svg.appendChild(path);

  });

}

$("newSafe").addEventListener(
  "click",
  startGame
);

$("difficulty").addEventListener(
  "change",
  startGame
);

$("clearSelection").addEventListener(
  "click",
  () => {

    selectedLeft = null;

    updateUI();

  }
);

window.addEventListener(
  "resize",
  () => requestAnimationFrame(
    drawConnections
  )
);

startGame();

})();
</script>

</body>
</html>
